<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 圆形背景 -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)"/>

  <!-- 地球图标 -->
  <circle cx="64" cy="64" r="35" fill="none" stroke="white" stroke-width="3"/>
  <ellipse cx="64" cy="64" rx="15" ry="35" fill="none" stroke="white" stroke-width="3"/>
  <line x1="29" y1="64" x2="99" y2="64" stroke="white" stroke-width="3"/>
  <path d="M 64 29 Q 50 64 64 99" fill="none" stroke="white" stroke-width="3"/>
  <path d="M 64 29 Q 78 64 64 99" fill="none" stroke="white" stroke-width="3"/>

  <!-- ChinaCNU 字母标识 (简化为 C) -->
  <text x="64" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">ChinaCNU</text>
</svg>
